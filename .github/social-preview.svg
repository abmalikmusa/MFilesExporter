<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- ============ Background ============ -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- ============ Grid dots (subtle) ============ -->
  <g fill="#1e293b" opacity="0.6">
    <!-- 12 x 6 grid of small dots -->
    <g>
      <circle cx="60"   cy="60"  r="1.5"/><circle cx="160"  cy="60"  r="1.5"/><circle cx="260"  cy="60"  r="1.5"/><circle cx="360"  cy="60"  r="1.5"/>
      <circle cx="460"  cy="60"  r="1.5"/><circle cx="560"  cy="60"  r="1.5"/><circle cx="660"  cy="60"  r="1.5"/><circle cx="760"  cy="60"  r="1.5"/>
      <circle cx="860"  cy="60"  r="1.5"/><circle cx="960"  cy="60"  r="1.5"/><circle cx="1060" cy="60"  r="1.5"/><circle cx="1160" cy="60"  r="1.5"/>
      <circle cx="60"   cy="160" r="1.5"/><circle cx="160"  cy="160" r="1.5"/><circle cx="260"  cy="160" r="1.5"/><circle cx="360"  cy="160" r="1.5"/>
      <circle cx="460"  cy="160" r="1.5"/><circle cx="560"  cy="160" r="1.5"/><circle cx="660"  cy="160" r="1.5"/><circle cx="760"  cy="160" r="1.5"/>
      <circle cx="860"  cy="160" r="1.5"/><circle cx="960"  cy="160" r="1.5"/><circle cx="1060" cy="160" r="1.5"/><circle cx="1160" cy="160" r="1.5"/>
      <circle cx="60"   cy="260" r="1.5"/><circle cx="160"  cy="260" r="1.5"/><circle cx="260"  cy="260" r="1.5"/><circle cx="360"  cy="260" r="1.5"/>
      <circle cx="460"  cy="260" r="1.5"/><circle cx="560"  cy="260" r="1.5"/><circle cx="660"  cy="260" r="1.5"/><circle cx="760"  cy="260" r="1.5"/>
      <circle cx="860"  cy="260" r="1.5"/><circle cx="960"  cy="260" r="1.5"/><circle cx="1060" cy="260" r="1.5"/><circle cx="1160" cy="260" r="1.5"/>
      <circle cx="60"   cy="360" r="1.5"/><circle cx="160"  cy="360" r="1.5"/><circle cx="260"  cy="360" r="1.5"/><circle cx="360"  cy="360" r="1.5"/>
      <circle cx="460"  cy="360" r="1.5"/><circle cx="560"  cy="360" r="1.5"/><circle cx="660"  cy="360" r="1.5"/><circle cx="760"  cy="360" r="1.5"/>
      <circle cx="860"  cy="360" r="1.5"/><circle cx="960"  cy="360" r="1.5"/><circle cx="1060" cy="360" r="1.5"/><circle cx="1160" cy="360" r="1.5"/>
      <circle cx="60"   cy="460" r="1.5"/><circle cx="160"  cy="460" r="1.5"/><circle cx="260"  cy="460" r="1.5"/><circle cx="360"  cy="460" r="1.5"/>
      <circle cx="460"  cy="460" r="1.5"/><circle cx="560"  cy="460" r="1.5"/><circle cx="660"  cy="460" r="1.5"/><circle cx="760"  cy="460" r="1.5"/>
      <circle cx="860"  cy="460" r="1.5"/><circle cx="960"  cy="460" r="1.5"/><circle cx="1060" cy="460" r="1.5"/><circle cx="1160" cy="460" r="1.5"/>
      <circle cx="60"   cy="560" r="1.5"/><circle cx="160"  cy="560" r="1.5"/><circle cx="260"  cy="560" r="1.5"/><circle cx="360"  cy="560" r="1.5"/>
      <circle cx="460"  cy="560" r="1.5"/><circle cx="560"  cy="560" r="1.5"/><circle cx="660"  cy="560" r="1.5"/><circle cx="760"  cy="560" r="1.5"/>
      <circle cx="860"  cy="560" r="1.5"/><circle cx="960"  cy="560" r="1.5"/><circle cx="1060" cy="560" r="1.5"/><circle cx="1160" cy="560" r="1.5"/>
    </g>
  </g>

  <!-- ============ Pipeline visualization (right side) ============ -->
  <g transform="translate(760,190)" opacity="0.95">
    <!-- Nodes -->
    <g filter="url(#glow)">
      <circle cx="0"   cy="0"   r="14" fill="#22d3ee"/>
      <circle cx="110" cy="-50" r="10" fill="#22d3ee" opacity="0.85"/>
      <circle cx="110" cy="50"  r="10" fill="#22d3ee" opacity="0.85"/>
      <circle cx="220" cy="-80" r="8"  fill="#818cf8" opacity="0.85"/>
      <circle cx="220" cy="-20" r="8"  fill="#818cf8" opacity="0.85"/>
      <circle cx="220" cy="40"  r="8"  fill="#818cf8" opacity="0.85"/>
      <circle cx="220" cy="100" r="8"  fill="#818cf8" opacity="0.85"/>
      <circle cx="330" cy="0"   r="14" fill="#a78bfa"/>
      <circle cx="440" cy="0"   r="12" fill="#f472b6"/>
    </g>

    <!-- Edges -->
    <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M 14 0 L 100 -50"/>
      <path d="M 14 0 L 100 50"/>
      <path d="M 120 -50 L 212 -80"/>
      <path d="M 120 -50 L 212 -20"/>
      <path d="M 120 50 L 212 40"/>
      <path d="M 120 50 L 212 100"/>
      <path d="M 228 -80 L 320 0"/>
      <path d="M 228 -20 L 320 0"/>
      <path d="M 228 40 L 320 0"/>
      <path d="M 228 100 L 320 0"/>
      <path d="M 344 0 L 428 0"/>
    </g>

    <!-- Labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8">
      <text x="-12"  y="34" text-anchor="middle">source</text>
      <text x="110" y="-70" text-anchor="middle">producer</text>
      <text x="220" y="130" text-anchor="middle">workers</text>
      <text x="330" y="34" text-anchor="middle">sink</text>
      <text x="440" y="34" text-anchor="middle">disk</text>
    </g>
  </g>

  <!-- ============ Title stack (left side) ============ -->
  <g transform="translate(80,220)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif">
    <!-- Small eyebrow -->
    <text x="0" y="0" font-size="16" font-weight="600" fill="#22d3ee" letter-spacing="4">ENTERPRISE · .NET 9 · CLEAN ARCHITECTURE</text>

    <!-- Big title -->
    <text x="0" y="70" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-1">MFilesExporter</text>

    <!-- Subtitle -->
    <text x="0" y="120" font-size="26" font-weight="400" fill="#cbd5e1">
      Stream, resume, idempotently export ~5M documents
    </text>
    <text x="0" y="152" font-size="26" font-weight="400" fill="#cbd5e1">
      from an M-Files SQL Server vault.
    </text>
  </g>

  <!-- ============ Feature chips (bottom) ============ -->
  <g transform="translate(80,520)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="15">
    <!-- chip: SQL Streaming -->
    <g>
      <rect x="0"   y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75"  y="22" text-anchor="middle" fill="#cbd5e1">SQL Streaming</text>
    </g>
    <!-- chip: Fencing Tokens -->
    <g transform="translate(160,0)">
      <rect x="0"   y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75"  y="22" text-anchor="middle" fill="#cbd5e1">Fencing Tokens</text>
    </g>
    <!-- chip: WAL Checkpoints -->
    <g transform="translate(320,0)">
      <rect x="0"   y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="85"  y="22" text-anchor="middle" fill="#cbd5e1">WAL Checkpoints</text>
    </g>
    <!-- chip: OpenTelemetry -->
    <g transform="translate(500,0)">
      <rect x="0"   y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="80"  y="22" text-anchor="middle" fill="#cbd5e1">OpenTelemetry</text>
    </g>
    <!-- chip: Serilog -->
    <g transform="translate(670,0)">
      <rect x="0"   y="0" width="100" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50"  y="22" text-anchor="middle" fill="#cbd5e1">Serilog</text>
    </g>
    <!-- chip: Spectre.Console -->
    <g transform="translate(780,0)">
      <rect x="0"   y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="85"  y="22" text-anchor="middle" fill="#cbd5e1">Spectre.Console</text>
    </g>
  </g>

  <!-- ============ Accent bar (top) ============ -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
</svg>
