name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Emit test-result artifact name so the downstream job can pick it up.
      unit-artifact: unit-test-results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MFilesExporter.sln

      - name: Build (Release)
        run: dotnet build MFilesExporter.sln --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test tests/MFilesExporter.Tests/MFilesExporter.Tests.csproj \
            --no-build --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  integration:
    name: Integration tests (SQL Server via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MFilesExporter.sln

      - name: Build (Release)
        run: dotnet build MFilesExporter.sln --no-restore --configuration Release

      - name: Pre-pull SQL Server 2022 image
        # Testcontainers will pull on demand, but doing it up-front makes the
        # per-test collection start-up predictable and surfaces registry
        # problems separately from test failures.
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Integration tests
        env:
          # Testcontainers on GitHub-hosted runners uses the default Docker
          # socket at /var/run/docker.sock — no extra config needed.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          dotnet test tests/MFilesExporter.IntegrationTests/MFilesExporter.IntegrationTests.csproj \
            --no-build --configuration Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
